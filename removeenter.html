<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>换行替换成空格</title>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      padding: 20px;
      max-width: 800px;
      margin: 0 auto;
      line-height: 1.6;
    }
    textarea {
      width: 100%;
      height: 160px;
      box-sizing: border-box;
      padding: 10px;
      font-size: 14px;
      resize: vertical;
    }
    button {
      padding: 8px 16px;
      margin: 10px 10px 10px 0;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
    }
    button.primary {
      background: #2563eb;
      color: #fff;
    }
    button.secondary {
      background: #e5e7eb;
    }
    button.danger {
      background: #ef4444;
      color: #fff;
    }
    .label {
      font-weight: 600;
      margin: 10px 0 4px;
    }

    /* Toast 样式 */
    .toast {
      position: fixed;
      top: 20px;
      right: 20px;
      background: rgba(0, 0, 0, 0.8);
      color: #fff;
      padding: 12px 18px;
      border-radius: 6px;
      font-size: 14px;
      opacity: 0;
      transform: translateY(-10px);
      transition: opacity 0.3s ease, transform 0.3s ease;
      pointer-events: none;
      z-index: 999;
    }
    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</head>
<body>
  <h1>换行替换成空格</h1>

  <div>
    <div class="label">输入文本：</div>
    <textarea id="input"></textarea>
  </div>

  <div>
    <button class="primary" id="convertBtn">换行 → 空格（自动复制）</button>
    <button class="danger" id="clearBtn">清空输入内容</button>
  </div>

  <div>
    <div class="label">结果：</div>
    <textarea id="output" readonly></textarea>
  </div>

  <!-- Toast -->
  <div id="toast" class="toast"></div>

  <script>
    const input = document.getElementById('input');
    const output = document.getElementById('output');
    const convertBtn = document.getElementById('convertBtn');
    const clearBtn = document.getElementById('clearBtn');
    const toast = document.getElementById('toast');

    // 显示 Toast
    function showToast(message) {
      toast.textContent = message;
      toast.classList.add('show');

      setTimeout(() => {
        toast.classList.remove('show');
      }, 2000);
    }

    // 点击 “换行 → 空格 + 自动复制”
    convertBtn.addEventListener('click', async () => {
      const text = input.value.trim();

      if (!text) {
        showToast('输入内容为空');
        return;
      }

      const result = text.replace(/[\r\n]+/g, ' ');
      output.value = result;

      try {
        await navigator.clipboard.writeText(result);
        showToast('转换成功并已复制到剪贴板');
      } catch (e) {
        showToast('复制失败，请手动复制');
      }
    });

    // 清空输入内容
    clearBtn.addEventListener('click', () => {
      input.value = '';
      output.value = '';
      showToast('已清空输入内容');
      navigator.clipboard.readText().then(text => {
        input.value = text;
        showToast('已从剪贴板粘贴内容到输入框');
      });
    });
  </script>
</body>
</html>
