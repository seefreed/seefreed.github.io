<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MacBook Neo - Impressions Reincarnated</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      max-width: 900px;
      margin: 0 auto;
      padding: 20px;
      background: #1a1a1a;
      color: #f5f5f5;
    }
    h1 {
      text-align: center;
      color: #fff;
    }
    .controls {
      position: sticky;
      top: 0;
      background: #1a1a1a;
      padding: 15px 0;
      border-bottom: 1px solid #333;
      margin-bottom: 20px;
      display: flex;
      gap: 20px;
      align-items: center;
      z-index: 100;
    }
    .controls label {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      font-size: 16px;
    }
    .controls input[type="checkbox"] {
      width: 18px;
      height: 18px;
      cursor: pointer;
    }
    .segment-subtitle-toggle {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: #888;
      cursor: pointer;
    }
    .segment-subtitle-toggle input {
      width: 16px;
      height: 16px;
      cursor: pointer;
    }
    .segment {
      background: #2a2a2a;
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 15px;
    }
    .segment-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .segment-title {
      font-weight: 600;
      color: #a0a0a0;
    }
    .segment video {
      width: 100%;
      max-height: 400px;
      background: #000;
      border-radius: 4px;
    }
    .subtitle {
      margin-top: 12px;
      padding: 10px;
      background: #333;
      border-radius: 4px;
      font-size: 15px;
      line-height: 1.5;
      display: none;
    }
    .subtitle.visible {
      display: block;
    }
    .subtitle-sentence {
      margin: 4px 0;
      padding: 4px 8px;
      background: #444;
      border-radius: 4px;
      font-size: 14px;
    }
    .play-btn {
      background: #007aff;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
    }
    .play-btn:hover {
      background: #0056b3;
    }
  </style>
</head>
<body>
  <h1>MacBook Neo - Impressions Reincarnated</h1>
  
  <div class="controls">
    <label>
      <input type="checkbox" id="loopToggle" checked>
      Loop Playback
    </label>
    <label>
      <input type="checkbox" id="subtitleToggle">
      Show All Subtitles
    </label>
  </div>

  <div id="segments"></div>

  <script>
    const manifestUrl = './audios/Macbook_Neo_Impressions_Reincarnated/manifest.json';
    const basePath = './audios/Macbook_Neo_Impressions_Reincarnated/';

    let showSubtitles = false;
    let loopEnabled = true;

    async function loadManifest() {
      try {
        const response = await fetch(manifestUrl);
        const data = await response.json();
        renderSegments(data);
      } catch (error) {
        console.error('Error loading manifest:', error);
        document.getElementById('segments').innerHTML = 
          '<p style="color: #ff6b6b;">Error loading manifest. Please ensure the file exists.</p>';
      }
    }

    function renderSegments(segments) {
      const container = document.getElementById('segments');
      container.innerHTML = '';

      segments.forEach((segment, index) => {
        const div = document.createElement('div');
        div.className = 'segment';
        div.innerHTML = `
          <div class="segment-header">
            <span class="segment-title">Segment ${segment.index}: ${segment.filename}</span>
            <div style="display: flex; gap: 10px; align-items: center;">
              <label class="segment-subtitle-toggle">
                <input type="checkbox" class="subtitle-individual" data-index="${index}" ${showSubtitles ? 'checked' : ''}>
                Subtitle
              </label>
              <button class="play-btn" id="btn-${index}" onclick="playSegment(${index})">Play</button>
            </div>
          </div>
          <video
            id="video-${index}"
            src="${basePath}${segment.filename}"
            preload="metadata"
            ${loopEnabled ? 'loop' : ''}
          ></video>
          <div class="subtitle ${showSubtitles ? 'visible' : ''}" id="subtitle-${index}">
            <div style="margin-bottom: 8px; font-weight: 600; color: #888;">Full Text:</div>
            <div>${segment.text}</div>
            ${segment.sentences && segment.sentences.length > 1 ? `
              <div style="margin-top: 10px; font-weight: 600; color: #888;">Sentences:</div>
              ${segment.sentences.map(s => `
                <div class="subtitle-sentence">
                  [${formatTime(s.start)} - ${formatTime(s.end)}] ${s.text}
                </div>
              `).join('')}
            ` : ''}
          </div>
        `;
        container.appendChild(div);
      });
    }

    function formatTime(seconds) {
      const mins = Math.floor(seconds / 60);
      const secs = Math.floor(seconds % 60);
      return `${mins}:${secs.toString().padStart(2, '0')}`;
    }

    function playSegment(index) {
      const video = document.getElementById(`video-${index}`);
      const btn = document.getElementById(`btn-${index}`);
      if (video.paused) {
        video.play();
      } else {
        video.pause();
      }
    }

    function updatePlayButton(video, btn) {
      if (video.paused) {
        btn.textContent = 'Play';
        btn.style.background = '#007aff';
      } else {
        btn.textContent = 'Pause';
        btn.style.background = '#ff9500';
      }
    }

    document.getElementById('segments').addEventListener('play', (e) => {
      if (e.target.tagName === 'VIDEO') {
        const index = e.target.id.replace('video-', '');
        const btn = document.getElementById(`btn-${index}`);
        if (btn) updatePlayButton(e.target, btn);
      }
    }, true);

    document.getElementById('segments').addEventListener('pause', (e) => {
      if (e.target.tagName === 'VIDEO') {
        const index = e.target.id.replace('video-', '');
        const btn = document.getElementById(`btn-${index}`);
        if (btn) updatePlayButton(e.target, btn);
      }
    }, true);

    document.getElementById('segments').addEventListener('ended', (e) => {
      if (e.target.tagName === 'VIDEO') {
        const index = e.target.id.replace('video-', '');
        const btn = document.getElementById(`btn-${index}`);
        if (btn) updatePlayButton(e.target, btn);
      }
    }, true);

    document.getElementById('loopToggle').addEventListener('change', (e) => {
      loopEnabled = e.target.checked;
      document.querySelectorAll('video').forEach(video => {
        video.loop = loopEnabled;
      });
    });

    document.getElementById('subtitleToggle').addEventListener('change', (e) => {
      showSubtitles = e.target.checked;
      document.querySelectorAll('.subtitle').forEach(sub => {
        sub.classList.toggle('visible', showSubtitles);
      });
      document.querySelectorAll('.subtitle-individual').forEach(chk => {
        chk.checked = showSubtitles;
      });
    });

    document.getElementById('segments').addEventListener('change', (e) => {
      if (e.target.classList.contains('subtitle-individual')) {
        const index = e.target.dataset.index;
        const subtitle = document.getElementById(`subtitle-${index}`);
        subtitle.classList.toggle('visible', e.target.checked);
      }
    });

    loadManifest();
  </script>
</body>
</html>
