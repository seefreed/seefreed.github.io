<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SPEED READER</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-primary: #1a1a2e;
      --bg-secondary: #16213e;
      --text-primary: #e8e8e8;
      --text-secondary: #a0a0a0;
      --accent: #e94560;
      --accent-hover: #ff6b6b;
      --border: #2a2a4a;
    }

    [data-theme="light"] {
      --bg-primary: #f8f6f1;
      --bg-secondary: #ebe7de;
      --text-primary: #2c2c2c;
      --text-secondary: #7a7a7a;
      --accent: #d94e3d;
      --accent-hover: #e85a4a;
      --border: #d4cfc4;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      overflow: hidden;
      transition: background 0.3s ease, color 0.3s ease;
    }

    /* Upload Screen */
    .upload-screen {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2rem;
      z-index: 100;
      background: var(--bg-primary);
      transition: opacity 0.5s ease, transform 0.5s ease;
    }

    .upload-screen.hidden {
      opacity: 0;
      transform: scale(0.95);
      pointer-events: none;
    }

    .title {
      font-family: 'Outfit', sans-serif;
      font-weight: 600;
      font-size: clamp(3rem, 12vw, 10rem);
      letter-spacing: -0.03em;
      line-height: 0.95;
      text-align: center;
      background: linear-gradient(135deg, var(--text-primary) 0%, var(--text-secondary) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .upload-zone {
      position: relative;
      width: min(600px, 90vw);
      height: 280px;
      border: 2px dashed var(--border);
      border-radius: 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      cursor: pointer;
      transition: all 0.3s ease;
      background: var(--bg-secondary);
    }

    .upload-zone:hover, .upload-zone.dragover {
      border-color: var(--accent);
      background: rgba(255, 107, 53, 0.05);
    }

    .upload-zone input[type="file"] {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
    }

    .upload-icon {
      width: 64px;
      height: 64px;
      stroke: var(--text-secondary);
      transition: stroke 0.3s ease;
    }

    .upload-zone:hover .upload-icon {
      stroke: var(--accent);
    }

    .upload-text {
      font-size: 0.875rem;
      color: var(--text-secondary);
      text-align: center;
    }

    .upload-text strong {
      color: var(--accent);
    }

    /* Reader Screen */
    .reader-screen {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.5s ease;
    }

    .reader-screen.active {
      opacity: 1;
      pointer-events: all;
    }

    /* Word Display Area */
    .word-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      position: relative;
    }

    .word {
      font-family: 'Outfit', sans-serif;
      font-weight: 500;
      font-size: clamp(3rem, 18vw, 12rem);
      text-align: center;
      line-height: 1;
      color: var(--text-primary);
      max-width: 100%;
      word-wrap: break-word;
      letter-spacing: -0.02em;
    }

    .word-pivot {
      color: var(--accent);
    }

    /* Controls */
    .controls {
      padding: 2rem 3rem;
      background: var(--bg-secondary);
      border-top: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .progress-bar {
      width: 100%;
      height: 2px;
      background: var(--border);
      position: relative;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: var(--accent);
      width: 0%;
      transition: width 0.1s linear;
    }

    .controls-row {
      display: flex;
      align-items: center;
      gap: 2rem;
      flex-wrap: wrap;
    }

    .play-button {
      width: 60px;
      height: 60px;
      border: 2px solid var(--text-primary);
      background: transparent;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
      flex-shrink: 0;
    }

    .play-button:hover {
      background: var(--text-primary);
    }

    .play-button:hover svg {
      stroke: var(--bg-primary);
    }

    .play-button svg {
      width: 24px;
      height: 24px;
      stroke: var(--text-primary);
      transition: stroke 0.3s ease;
    }

    .speed-control {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 1rem;
      min-width: 280px;
    }

    .speed-label {
      font-size: 0.75rem;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      white-space: nowrap;
    }

    .speed-value {
      font-size: 1rem;
      font-weight: 700;
      color: var(--accent);
      min-width: 80px;
      text-align: right;
    }

    .speed-slider {
      flex: 1;
      -webkit-appearance: none;
      appearance: none;
      height: 4px;
      background: var(--border);
      border-radius: 2px;
      outline: none;
      cursor: pointer;
    }

    .speed-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 16px;
      height: 16px;
      background: var(--accent);
      border-radius: 50%;
      cursor: pointer;
      transition: transform 0.2s ease;
    }

    .speed-slider::-webkit-slider-thumb:hover {
      transform: scale(1.2);
    }

    .speed-slider::-moz-range-thumb {
      width: 16px;
      height: 16px;
      background: var(--accent);
      border: none;
      border-radius: 50%;
      cursor: pointer;
      transition: transform 0.2s ease;
    }

    .speed-slider::-moz-range-thumb:hover {
      transform: scale(1.2);
    }

    .stats {
      display: flex;
      gap: 2rem;
      font-size: 0.75rem;
      color: var(--text-secondary);
    }

    .stat-item {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }

    .stat-label {
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    .stat-value {
      font-size: 1rem;
      color: var(--text-primary);
      font-weight: 500;
    }

    .reset-button {
      padding: 0.5rem 1rem;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.75rem;
      color: var(--text-secondary);
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.3s ease;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    .reset-button:hover {
      color: var(--text-primary);
      border-color: var(--text-primary);
    }

    .theme-toggle {
      padding: 0.5rem 1rem;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.75rem;
      color: var(--text-secondary);
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .theme-toggle:hover {
      color: var(--text-primary);
      border-color: var(--text-primary);
    }

    .theme-toggle svg {
      width: 16px;
      height: 16px;
    }

    /* Responsive */
    @media (max-width: 768px) {
      .controls {
        padding: 1.5rem;
      }

      .controls-row {
        gap: 1rem;
      }

      .stats {
        display: none;
      }

      .play-button {
        width: 48px;
        height: 48px;
      }

      .play-button svg {
        width: 20px;
        height: 20px;
      }
    }
  </style>
</head>
<body>
  <!-- Upload Screen -->
  <div class="upload-screen" id="uploadScreen">
    <h1 class="title">SPEED<br>READER</h1>
    <div class="upload-zone" id="uploadZone">
      <input type="file" id="fileInput" accept=".txt,.md" />
      <svg class="upload-icon" viewBox="0 0 24 24" fill="none" stroke-width="1.5">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
        <polyline points="17 8 12 3 7 8" />
        <line x1="12" y1="3" x2="12" y2="15" />
      </svg>
      <div class="upload-text">
        <strong>Click to upload</strong> or drag and drop<br>
        .txt or .markdown files
      </div>
    </div>
  </div>

  <!-- Reader Screen -->
  <div class="reader-screen" id="readerScreen">
    <div class="word-container">
      <div class="word" id="wordDisplay">Ready</div>
    </div>

    <div class="controls">
      <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
      </div>

      <div class="controls-row">
        <button class="play-button" id="playButton">
          <svg id="playIcon" viewBox="0 0 24 24" fill="none" stroke-width="2">
            <polygon points="5 3 19 12 5 21 5 3" />
          </svg>
          <svg id="pauseIcon" viewBox="0 0 24 24" fill="none" stroke-width="2" style="display: none;">
            <rect x="6" y="4" width="4" height="16" />
            <rect x="14" y="4" width="4" height="16" />
          </svg>
        </button>

        <div class="speed-control">
          <span class="speed-label">Speed</span>
          <input type="range" class="speed-slider" id="speedSlider" min="50" max="600" value="200" />
          <span class="speed-value" id="speedValue">200 WPM</span>
        </div>

        <div class="stats">
          <div class="stat-item">
            <span class="stat-label">Word</span>
            <span class="stat-value" id="currentWord">0 / 0</span>
          </div>
          <div class="stat-item">
            <span class="stat-label">Time</span>
            <span class="stat-value" id="timeRemaining">--:--</span>
          </div>
        </div>

        <button class="reset-button" id="restartButton">Restart</button>
        <button class="reset-button" id="resetButton">New File</button>
        <button class="theme-toggle" id="themeToggle">
          <svg class="sun-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="5"/>
            <line x1="12" y1="1" x2="12" y2="3"/>
            <line x1="12" y1="21" x2="12" y2="23"/>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
            <line x1="1" y1="12" x2="3" y2="12"/>
            <line x1="21" y1="12" x2="23" y2="12"/>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
          </svg>
          <svg class="moon-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display: none;">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <script>
    // State
    let words = [];
    let currentIndex = 0;
    let isPlaying = false;
    let wpm = 200;
    let timeoutId = null;

    // Elements
    const uploadScreen = document.getElementById('uploadScreen');
    const readerScreen = document.getElementById('readerScreen');
    const uploadZone = document.getElementById('uploadZone');
    const fileInput = document.getElementById('fileInput');
    const wordDisplay = document.getElementById('wordDisplay');
    const playButton = document.getElementById('playButton');
    const playIcon = document.getElementById('playIcon');
    const pauseIcon = document.getElementById('pauseIcon');
    const speedSlider = document.getElementById('speedSlider');
    const speedValue = document.getElementById('speedValue');
    const progressFill = document.getElementById('progressFill');
    const currentWordEl = document.getElementById('currentWord');
    const timeRemainingEl = document.getElementById('timeRemaining');
    const restartButton = document.getElementById('restartButton');
    const resetButton = document.getElementById('resetButton');
    const themeToggle = document.getElementById('themeToggle');
    const sunIcon = document.querySelector('.sun-icon');
    const moonIcon = document.querySelector('.moon-icon');

    // Theme handling
    function initTheme() {
      const savedTheme = localStorage.getItem('theme');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;

      if (savedTheme === 'light') {
        document.documentElement.setAttribute('data-theme', 'light');
        updateThemeIcon('light');
      } else {
        // Default to dark mode (no attribute needed)
        document.documentElement.removeAttribute('data-theme');
        updateThemeIcon('dark');
      }
    }

    function updateThemeIcon(theme) {
      if (theme === 'light') {
        sunIcon.style.display = 'none';
        moonIcon.style.display = 'block';
      } else {
        sunIcon.style.display = 'block';
        moonIcon.style.display = 'none';
      }
    }

    function toggleTheme() {
      const currentTheme = document.documentElement.getAttribute('data-theme');
      const newTheme = currentTheme === 'light' ? 'dark' : 'light';

      if (newTheme === 'light') {
        document.documentElement.setAttribute('data-theme', 'light');
      } else {
        document.documentElement.removeAttribute('data-theme');
      }
      localStorage.setItem('theme', newTheme);
      updateThemeIcon(newTheme);
    }

    themeToggle.addEventListener('click', toggleTheme);
    initTheme();

    // File handling
    fileInput.addEventListener('change', handleFileSelect);

    uploadZone.addEventListener('dragover', (e) => {
      e.preventDefault();
      uploadZone.classList.add('dragover');
    });

    uploadZone.addEventListener('dragleave', () => {
      uploadZone.classList.remove('dragover');
    });

    uploadZone.addEventListener('drop', (e) => {
      e.preventDefault();
      uploadZone.classList.remove('dragover');
      const file = e.dataTransfer.files[0];
      if (file && (file.name.endsWith('.txt') || file.name.endsWith('.md'))) {
        loadFile(file);
      }
    });

    function handleFileSelect(e) {
      const file = e.target.files[0];
      if (file) {
        loadFile(file);
      }
    }

    function loadFile(file) {
      const reader = new FileReader();
      reader.onload = (e) => {
        const text = e.target.result;
        // Extract words, handling punctuation and newlines
        words = text
          .replace(/[^\w\s\u4e00-\u9fff\u3040-\u309f\u30a0-\u30ff\u0400-\u04ff\u0370-\u03ff\-']/g, ' ')
          .split(/\s+/)
          .filter(word => word.length > 0);

        currentIndex = 0;
        updateWordDisplay();
        updateStats();

        uploadScreen.classList.add('hidden');
        readerScreen.classList.add('active');
      };
      reader.readAsText(file);
    }

    // Word display with pivot point
    function updateWordDisplay() {
      if (currentIndex >= words.length) {
        stopReading();
        wordDisplay.textContent = 'Complete';
        return;
      }

      const word = words[currentIndex];

      // Find pivot point (roughly center of word, near first vowel if possible)
      const pivotIndex = findPivotPoint(word);
      const beforePivot = word.substring(0, pivotIndex);
      const pivotLetter = word[pivotIndex];
      const afterPivot = word.substring(pivotIndex + 1);

      wordDisplay.innerHTML = `${beforePivot}<span class="word-pivot">${pivotLetter}</span>${afterPivot}`;
    }

    function findPivotPoint(word) {
      if (word.length <= 1) return 0;

      const vowels = 'aeiouAEIOU';
      const center = Math.floor(word.length / 2);
      const range = 2;

      // Look for vowel near center
      for (let i = center - range; i <= center + range; i++) {
        if (i >= 0 && i < word.length && vowels.includes(word[i])) {
          return i;
        }
      }

      // Default to center
      return center;
    }

    // Playback controls
    function getInterval() {
      return (60 / wpm) * 1000;
    }

    function startReading() {
      isPlaying = true;
      playIcon.style.display = 'none';
      pauseIcon.style.display = 'block';
      nextWord();
    }

    function stopReading() {
      isPlaying = false;
      playIcon.style.display = 'block';
      pauseIcon.style.display = 'none';
      if (timeoutId) {
        clearTimeout(timeoutId);
        timeoutId = null;
      }
    }

    function nextWord() {
      if (!isPlaying) return;

      updateWordDisplay();
      updateStats();

      currentIndex++;

      if (currentIndex >= words.length) {
        stopReading();
        return;
      }

      timeoutId = setTimeout(nextWord, getInterval());
    }

    function updateStats() {
      const progress = (currentIndex / words.length) * 100;
      progressFill.style.width = `${progress}%`;
      currentWordEl.textContent = `${currentIndex} / ${words.length}`;

      const remainingWords = words.length - currentIndex;
      const remainingMinutes = remainingWords / wpm;
      const minutes = Math.floor(remainingMinutes);
      const seconds = Math.floor((remainingMinutes % 1) * 60);
      timeRemainingEl.textContent = `${minutes}:${seconds.toString().padStart(2, '0')}`;
    }

    playButton.addEventListener('click', () => {
      if (isPlaying) {
        stopReading();
      } else {
        if (currentIndex >= words.length) {
          currentIndex = 0;
        }
        startReading();
      }
    });

    speedSlider.addEventListener('input', (e) => {
      wpm = parseInt(e.target.value);
      speedValue.textContent = `${wpm} WPM`;
    });

    restartButton.addEventListener('click', () => {
      stopReading();
      currentIndex = 0;
      updateWordDisplay();
      updateStats();
    });

    resetButton.addEventListener('click', () => {
      stopReading();
      currentIndex = 0;
      words = [];
      fileInput.value = '';

      readerScreen.classList.remove('active');
      uploadScreen.classList.remove('hidden');

      progressFill.style.width = '0%';
      currentWordEl.textContent = '0 / 0';
      timeRemainingEl.textContent = '--:--';
      wordDisplay.textContent = 'Ready';
    });

    // Keyboard shortcuts
    document.addEventListener('keydown', (e) => {
      if (e.code === 'Space' && !uploadScreen.classList.contains('hidden')) {
        e.preventDefault();
        return;
      }

      if (readerScreen.classList.contains('active')) {
        if (e.code === 'Space') {
          e.preventDefault();
          if (isPlaying) {
            stopReading();
          } else {
            if (currentIndex >= words.length) {
              currentIndex = 0;
            }
            startReading();
          }
        } else if (e.code === 'ArrowRight' && !isPlaying) {
          currentIndex = Math.min(currentIndex + 1, words.length - 1);
          updateWordDisplay();
          updateStats();
        } else if (e.code === 'ArrowLeft' && !isPlaying) {
          currentIndex = Math.max(currentIndex - 1, 0);
          updateWordDisplay();
          updateStats();
        }
      }
    });
  </script>
</body>
</html>
